apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-keys
  namespace: biogama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: biogama-web
  namespace: biogama
spec:
  type: NodePort
  selector:
    app: biogama-web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: biogama-web
  namespace: biogama
spec:
  replicas: 2
  selector:
    matchLabels:
      app: biogama-web
  template:
    metadata:
      labels:
        app: biogama-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: biogama-web:k8s-v10
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: America/Guayaquil
            - name: APP_VERSION
              value: k8s-v10
            - name: ConnectionStrings__Redis
              value: redis:6379,abortConnect=false
            # La base de pruebas ya fue inicializada con la primera replica.
            - name: Database__InitializeOnStartup
              value: "false"
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_URLS
              value: http://0.0.0.0:8080
            - name: ConnectionStrings__DefaultConnection
              value: Host=db;Port=5432;Database=biogama_ecuador;Username=biogama_user
            - name: DataProtection__KeysPath
              value: /app/keys
          resources:
            requests:
              ephemeral-storage: 100Mi
              cpu: 100m
              memory: 256Mi
            limits:
              ephemeral-storage: 1Gi
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: db-secret
              mountPath: /run/secrets
              readOnly: true
            - name: keys
              mountPath: /app/keys
      volumes:
        - name: db-secret
          secret:
            secretName: biogama-db
        - name: keys
          persistentVolumeClaim:
            claimName: web-keys
